[package]
name = "ministry_manager_server"
version = "0.1.0"
edition = "2024"

[dependencies]

# Asycrynous runtime and websockets
tokio = { version = "1", features = ["full", "sync"] }
tokio-tungstenite = "0.20"
futures-util = "0.3"

# Encryption
tokio-rustls = "0.26.4"
rustls = "0.23.37"
rustls-pemfile = "2.2.0"

# Database
sqlx = {version = "0.8.6", features = ["sqlite", "runtime-tokio"]}

# Serialize data
serde = "1.0.228"
rmp-serde = "1.3.1"

# Token Generation
rand = {version = "0.10.1", features = ["sys_rng"]}

# Hashing
argon2 = "0.5.3" 
blake2 = "0.10.6"
hex = "0.4"
