[package]
name = "preaching_partner_server"
version = "0.1.0"
edition = "2024"

[dependencies]

# Asycrynous runtime and websockets
tokio = { version = "1", features = ["full", "sync"] }
tokio-tungstenite = "0.20"
futures-util = "0.3"

# Encryption
#openmls = { version = "0.8.1", features = ["test-utils"] }
#openmls_traits = "0.5.0"

# Database
sqlx = {version = "0.8.6", features = ["sqlite", "runtime-tokio"]}

# Serialize data
serde = "1.0.228"
rmp-serde = "1.3.1"

# Token Generation
rand = {version = "0.10.1", features = ["sys_rng"]}

# Hashing
argon2 = "0.5.3" 
blake2 = "0.10.6"
hex = "0.4"
