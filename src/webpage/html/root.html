<!DOCTYPE html>
<html>
<head>
    <title>Preaching Partner Admin Dashboard</title>
</head>
<body>
    <h1>Preaching Partner Admin Dashboard</h1>
    <p>Welcome to your Preaching Partner admin dashboard!</p>
    <hr>

    <section>
        <h2>Congregations</h2>
        <a href="/congregation/new">Create Congregation</a>
        <div class="cong-box">
            {{for row in table_data}}
                <a class="cong" href="/congregation/details/{row.cong_id}">
                    <p class="cong-name">{row.cong_name}</p>
                </a>
            {{ endfor }}
        </div>
    </section>

    <hr>
</body>
</html>
