<!DOCTYPE html>
<html>
<head>
    <title>Preaching Partner Admin Dashboard</title>
    <link rel="stylesheet" type="text/css" href="/style.css">
</head>
<body>
    <section class="title-box">
        <h1>Preaching Partner Admin Dashboard</h1>
    </section>
    
    <hr>

    <section class="select">
        <a class="create-selection" href="/congregation/new">Create Congregation</a>
        <div class="select-box">
            {{for row in table_data}}
                <a class="select-item" href="/congregation/details/{row.cong_id}">
                    <p class="">{row.cong_name}</p>
                </a>
            {{ endfor }}
        </div>
    </section>

</body>
</html>
