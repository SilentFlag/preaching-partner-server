<!DOCTYPE html>
<html>
    <head>
        <title>Create Congregation | Preaching Partner Server</title>
        <link rel="stylesheet" type="text/css" href="/style.css">
    </head>
    <body>
        <nav>
            <a href="/">&larr; Back</a>
            <span>Preaching Partner Admin Dashboard</span>
        </nav>

        <section class="title-box">
            <h1>Create Congregation</h1>
        </section>

        <hr>

        <section class="form">
            <form action="/congregation/new" method="post" enctype="multipart/form-data">
                <span>
                    <label for="name">Congregation Name:</label>
                    <input type="text" id="name" name="name" required>
                </span>
                <button type="submit">Create</button>
            </form>
        </section>
        
    </body>
</html>
