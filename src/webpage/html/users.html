<!DOCTYPE html>
<html>
<head>
    <title>Users | Preaching Partner Server</title>
</head>
<body>
    <h1>Users</h1>
    <a href="/user/new">create user</a>

    <table>
        <tbody>
        <tr>
            <th>First Name(s)</th>
            <th>Surname</th>
            <th>Enabled</th>
            <th>Primary Congregation</th>
        </tr>
        {{for row in table_data}}
        <tr>
            <td>
                {row.first_name}
            </td>
            <td>
                {row.last_name}
            </td>
            <td>
                {row.enabled}
            </td>
            <td>
                {row.primary_cong}
            </td>
        </tr>
        {{ endfor }}
        </tbody>
    </table>
</body>
</html>
