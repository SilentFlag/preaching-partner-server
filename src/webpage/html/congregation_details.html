<!DOCTYPE html>
<html>
<head>
    <title>Congregation Details | Preaching Partner Server</title>
    <link rel="stylesheet" type="text/css" href="/style.css">
</head>
<body>
    <nav>
        <a href="/">&larr; Back</a>
        <span>Preaching Partner Admin Dashboard</span>
    </nav>

    <section class="title-box">
        <h1>{data.cong_name} Congregation</h1>
    </section>
    
    <hr>

    <section class="select side-margin">
        <h2 class="select-title">Groups</h2>
        <a href="/groups/new/{data.cong_id}" class="create-selection">Create Group</a>
        <div class="select-box">
            {{for row in groups}}
                <a class="select-item" href="/group/details/{row.id}">
                    <p class="">{row.name}</p>
                </a>
            {{ endfor }}
        </div>
    </section>

    <hr>

    <section class="side-margin select">
        <h2 class="select-title">Maps</h2>
        <a href="/maps/import/{data.cong_id}" class="create-selection">Import Maps</a>
    </section>

    <hr>

    <section class="side-margin select">
        <h2 class="select-title">Users</h2>
        <!-- TODO: A way to add users without a csv file -->
        <a href="/users/import/{data.cong_id}" class="create-selection">Import Users</a>
        <table>
            <tr>
                <th>Firstname(s)</th>
                <th>Lastname</th>
            </tr>
            {{for row in users}}
                <tr>
                    <td>{row.first_name}</td>
                    <td>{row.last_name}</td>
                </tr>
            {{ endfor }}
        </table>
    </section>

    <hr>


</body>
</html>
