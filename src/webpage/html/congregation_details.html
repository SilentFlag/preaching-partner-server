<!DOCTYPE html>
<html>
<head>
    <title>Congregation Details | Preaching Partner Server</title>
</head>
<body>
    <h1>{data.cong_name} Congregation</h1>
    <a href="/">Back to Home</a>
    <h2>Details</h2>
    <hr>

    <section>
        <h2>Groups</h2>
        <a href="/groups/new/{data.cong_id}">Create Group</a>
        <div class="group-box">
            {{for row in groups}}
                <a class="group" href="/group/details/{row.id}">
                    <p class="group-name">{row.name}</p>
                </a>
            {{ endfor }}
        </div>
    </section>

    <hr>

    <h2>Users</h2>
    <a href="/users/import/{data.cong_id}">Add Users</a>
    <hr>


</body>
</html>
